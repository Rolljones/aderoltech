<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aderol Website</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header class="navbar">
        <div class="logo">
          <img src="./logo.PNG" alt="Logo" />
          <h3>Aderol Technologies</h3>
        </div>

        <button
          class="menu-toggle"
          id="menuToggle"
          aria-label="Toggle menu"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="nav-links" id="navLinks">
          <a href="#home" class="active">Home</a>
          <a href="#about">About</a>
          <a href="#services">Services</a>
          <a href="#contact">Contact</a>
          <a href="#contact" class="btn">Get In Touch</a>
        </nav>
      </header>
      <main>
        <section class="hero-section">
          <div class="hero-text">
            <h1>Meet the Aderol Parent <span>Platform</span></h1>
            <p>
              Aderol connects schools, teachers, parents, and educational
              organizations through smarter digital tools for managing, sharing,
              and communicating education.
            </p>
            <div class="button-flex">
              <a href="#contact" class="btn-one">Get In Touch</a>
              <a href="#solutions" class="btn-two">Explore Aderol</a>
            </div>
          </div>
        </section>
        <section></section>
        <section></section>
        <section></section>
      </main>
      <footer></footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
